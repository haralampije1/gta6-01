<style>html,body{margin:0;padding:0;overflow:hidden;background:#0b0c14}canvas{display:block}#ui{position:absolute;top:0;left:0;width:100vw;height:100vh;pointer-events:none}#msg{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);color:#fff;font:26px system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;pointer-events:none;display:none}#start{position:absolute;inset:0;background:#0a0b14;color:#ffe86f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;pointer-events:auto}#start h1{font-size:52px;margin:0 0 10px}#start p{color:#9aa3b2;margin:0 0 16px}#start .btn{background:#161a2c;border:2px solid #ffe86f;color:#ffe86f;padding:10px 26px;margin:6px 0;cursor:pointer;font:inherit;font-size:17px;border-radius:4px}#start .btn:hover{background:#20263c}</style></head><body><canvas id="g"></canvas><div id="ui"><div id="hud"></div><div id="msg"></div></div><div id="start"><h1>GRAND CITY</h1><p class="hint">STEAL CARS · EVADE POLICE · RUN MISSIONS · SURVIVE</p><p class="hint">WASD drive/walk · CLICK shoot/punch · F enter/exit vehicle · M mission</p><div><button class="btn" id="btNew">NEW GAME</button><button class="btn" id="btLoad">LOAD SAVE</button></div><p style="color:#6b7280;font-size:12px;max-width:260px;text-align:center">Original work — city, characters, vehicles, music, code all original.</p></div><script type="module" src="./src/main.js"></script></body></html>
